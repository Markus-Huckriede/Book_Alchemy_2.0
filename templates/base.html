<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2f6f73">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Book Alchemy">
    <title>{% block title %}Book Alchemy{% endblock %}</title>
    <link rel="manifest" href="{{ url_for('main.manifest') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<header class="site-header">
    <nav class="nav">
        <a class="brand" href="{{ url_for('main.home') }}">
            <span class="brand-mark">BA</span>
            <span>
                <strong>Book Alchemy</strong>
                <small>Deine Bibliothek</small>
            </span>
        </a>
        <div class="nav-actions">
            <a class="button" href="{{ url_for('main.add_book') }}">Buch hinzufügen</a>
        </div>
    </nav>
</header>

<main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-list" role="status" aria-live="polite">
                {% for category, message in messages %}
                    <p class="flash flash-{{ category }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
